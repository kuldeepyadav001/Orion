[package]
name = "orion"
version = "0.1.0"
description = "A private, offline-first personal AI"
authors = ["kuldeepyadav001"]
license = "Apache-2.0"
repository = "https://github.com/kuldeepyadav001/Orion"
edition = "2021"
rust-version = "1.77"

[lib]
name = "orion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.8"
sysinfo = "0.32"
dirs = "5"

[features]
default = ["tauri-glue"]
# Tauri's default custom-protocol feature is enabled by the CLI on build.
custom-protocol = ["tauri/custom-protocol"]
# The Tauri-dependent presence layer. Disabled in scratch test crates, which
# have no desktop session and cannot link webkit.
tauri-glue = []

# Dev profile tuned for low-RAM machines (8 GB dev laptop).
# Fast incremental builds matter more than runtime speed during development.
[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256
lto = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
