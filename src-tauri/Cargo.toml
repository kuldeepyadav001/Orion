[package]
name = "orion"
version = "0.1.0"
description = "A private, offline-first personal AI"
authors = ["kuldeepyadav001"]
license = "Apache-2.0"
repository = "https://github.com/kuldeepyadav001/Orion"
edition = "2021"
rust-version = "1.77"

[lib]
name = "orion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.8"
sysinfo = "0.32"

# Microphone capture. Optional so the crate still builds where there is no
# audio stack at all — CI containers and the dev sandbox have none, and a
# hard dependency would make the whole project unbuildable there.
cpal = { version = "0.18", optional = true }
dirs = "5"

# Document extraction. Feature-minimised on purpose: the full default sets
# pull in bzip2, zstd, AES and time, none of which Orion needs, and every
# crate in an offline security-sensitive app is audit surface.
# zip+quick-xml+lopdf = 50 transitive crates; using pdf-extract instead of
# lopdf would have been 105.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
# nom_parser, NOT pom_parser: lopdf 0.34's pom parser does not compile
# (get_object/indirect_object arity mismatch inside the crate itself).
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }

[target.'cfg(windows)'.dependencies]
# Job Objects, so sidecars are killed by the OS when this process dies for
# any reason — including an abort, where none of our own cleanup code runs.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # CreateJobObjectW takes a *const SECURITY_ATTRIBUTES, which lives behind
    # Win32_Security. Without it the whole JobObjects module is compiled out
    # and the import fails with "no CreateJobObjectW in Win32::System::JobObjects",
    # which reads like a wrong path rather than a missing feature.
    "Win32_Security",
] }

[features]
default = ["tauri-glue", "voice"]
# Microphone capture. Split out because cpal pulls in ALSA on Linux, which is
# not present in every build environment.
voice = ["dep:cpal"]
# Tauri's default custom-protocol feature is enabled by the CLI on build.
custom-protocol = ["tauri/custom-protocol"]
# The Tauri-dependent presence layer. Disabled in scratch test crates, which
# have no desktop session and cannot link webkit.
tauri-glue = []

# Dev profile tuned for low-RAM machines (8 GB dev laptop).
# Fast incremental builds matter more than runtime speed during development.
[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256
lto = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# NOT panic = "abort".
#
# `abort` produces a slightly smaller binary, and that was the original
# setting. It was wrong. Orion parses untrusted PDFs, DOCX and XLSX with
# third-party parsers (lopdf, zip, quick-xml); a panic in any of them is a
# realistic outcome for a malformed file, and under `abort` the entire
# application dies with no error message and an unsaved chat.
#
# `catch_unwind` in ingest::binary::guard is a no-op under `abort` — verified
# empirically, not assumed: the guarded call terminates the process and the
# line after it never runs. Keeping `abort` would have meant every
# panic-containment test in M2 passed in debug and protected nothing in
# release, which is worse than having no guard at all because it looks safe.
panic = "unwind"
